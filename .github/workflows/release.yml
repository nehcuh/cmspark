name: Release

# Builds distributable artifacts on native runners for all 3 platforms and
# publishes a GitHub Release when a `v*` tag is pushed.
#
# `workflow_dispatch` lets the matrix be dry-run on main WITHOUT creating a
# release (the release job is gated on a tag) — use it to verify the 3-platform
# build before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release creates the release + uploads assets

jobs:
  package:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: read   # least-privilege: builders only checkout + upload artifacts
    strategy:
      fail-fast: false   # a Windows/Linux failure must not abort the macOS build
      matrix:
        include:
          - os: macos-latest    # arm64
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            companion/package-lock.json
            chrome-extension/package-lock.json

      # package.sh runs `npm run build` in both dirs, so deps must be installed.
      # The companion postinstall (verify-systray2 + build-swift-tray) is
      # cross-platform safe — Swift build no-ops off macOS.
      - name: Install companion deps
        run: cd companion && npm ci

      - name: Install extension deps
        run: cd chrome-extension && npm ci

      - name: Package (${{ matrix.platform }})
        # package.sh: builds both projects, esbuild-bundles the companion,
        # sha256-verifies + downloads the target Node runtime, strips the
        # non-target systray2/node-notifier binaries, and zips the staging dir.
        # package.sh prefers Info-ZIP zip/unzip and falls back to 7-Zip on
        # windows-latest (Git Bash does not reliably ship zip/unzip); its tar
        # fallback chain handles BSD/libarchive tar on macOS/Windows.
        # P0-D: hard-fails if macOS host/tray or Windows host-scripts-win/ORT missing.
        shell: bash
        run: bash scripts/package.sh ${{ matrix.platform }}

      # P0-D fail-closed content asserts — package.sh already gates at stage time;
      # these unzip checks catch regressions if staging paths drift.
      - name: Assert macOS zip has host + tray + scpt
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist-package/cmspark-*-macos-arm64.zip | head -1)"
          echo "Checking ${ZIP}..."
          unzip -l "${ZIP}" | grep -E 'cmspark-host$'
          unzip -l "${ZIP}" | grep -E 'cmspark-tray$'
          unzip -l "${ZIP}" | grep -E 'host-scripts/.*\.scpt$'
          echo "macOS zip content assert OK"

      - name: Assert windows zip has host-scripts-win + TinyClick/ORT
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist-package/cmspark-*-windows-x64.zip | head -1)"
          echo "Checking ${ZIP}..."
          # 7z or unzip — windows-latest may lack unzip; package.sh already
          # produced the zip with 7z. Prefer unzip, fall back to 7z l.
          list_zip() {
            if command -v unzip >/dev/null 2>&1; then unzip -l "$1"
            else 7z l "$1"
            fi
          }
          list_zip "${ZIP}" | grep -E 'host-scripts-win/.*\.ps1'
          list_zip "${ZIP}" | grep -E 'tinyclick-worker\.js'
          list_zip "${ZIP}" | grep -E 'onnxruntime-node'
          echo "windows-x64 zip content assert OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmspark-${{ matrix.platform }}
          path: dist-package/cmspark-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    # Only create a release for a real tag — workflow_dispatch dry-runs stop here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
          body: |
            ## CMspark ${{ github.ref_name }}

            Distributable zips for companion + Chrome extension. See
            [`docs/remediation-plan-2026-07-09.md`](https://github.com/nehcuh/cmspark/blob/main/docs/remediation-plan-2026-07-09.md)
            and [`docs/supply-chain.md`](https://github.com/nehcuh/cmspark/blob/main/docs/supply-chain.md).

            ### Downloads
            Each zip is **self-contained** for its platform — companion bundle,
            Chrome extension (`chrome-extension/`, load unpacked), Node runtime
            (sha256-verified against nodejs.org), builtin skills, and platform
            host/tray assets as listed below:

            | File | Platform | Platform-critical assets |
            |---|---|---|
            | `cmspark-v*-macos-arm64.zip` | macOS (Apple Silicon) | `cmspark-host`, `cmspark-tray`, `host-scripts/*.scpt` |
            | `cmspark-v*-linux-x64.zip` | Linux x64 | systray2 linux binary |
            | `cmspark-v*-windows-x64.zip` | Windows x64 | `host-scripts-win/*.ps1`, `tinyclick-worker.js`, trimmed `onnxruntime-node` (win32/x64) |

            Packaging is **fail-closed** on platform-critical assets (aborts rather
            than shipping a zip that ENONTs at runtime):
            - **macos-arm64**: missing `cmspark-host`, `cmspark-tray`, or `host-scripts/*.scpt`
            - **windows-x64**: missing `host-scripts-win/*.ps1`, `tinyclick-worker.js`,
              or trimmed `onnxruntime-node` (win32/x64)
            - **macOS/Linux ORT**: optional soft stage — a missing ORT build does **not**
              abort the package job (TinyClick local model simply unavailable in that zip)

            ### Security notes (accurate as of this release)
            - **WS auth (audit C1)**: **FIXED** — origin allowlist + shared-secret
              HMAC handshake (`ws_secret` / challenge–response). Unauthenticated
              peers cannot drive the agent. Downstream docs must not claim the
              handshake is unfinished or postponed.
            - **Supply chain**: chrome-extension build-time advisories (plasmo/Parcel)
              are not shipped (`npm audit --omit=dev` = 0 on the extension runtime
              graph where applicable). See `docs/supply-chain.md`.
            - **Signing limits**: the bundled Node runtime is sha256-verified; app
              binaries are **not** Developer ID–codesigned / notarized / Authenticode-
              signed (pending certificates). macOS Gatekeeper / Windows SmartScreen
              may warn. Ad-hoc signed `cmspark-host` / tray satisfy local TCC needs
              only — not Gatekeeper distribution trust.

            Full install steps: project `CLAUDE.md` / `Agents.md` Quick Start.
