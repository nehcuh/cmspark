name: Release

# Builds distributable artifacts on native runners for all 3 platforms and
# publishes a GitHub Release when a `v*` tag is pushed.
#
# `workflow_dispatch` lets the matrix be dry-run on main WITHOUT creating a
# release (the release job is gated on a tag) — use it to verify the 3-platform
# build before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release creates the release + uploads assets

jobs:
  # REL-3 / P1: re-test + audit before packaging (do not ship untested artifacts)
  preflight:
    name: Test + audit (preflight)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            companion/package-lock.json
            chrome-extension/package-lock.json
      - name: Install companion deps
        run: cd companion && npm ci
      - name: Build companion
        run: cd companion && npm run build
      - name: Run companion tests
        run: cd companion && npm test
      - name: Supply-chain audit — companion (high+)
        run: cd companion && npm audit --omit=dev --audit-level=high
      - name: Build + test chrome-extension
        run: |
          cd chrome-extension && npm ci && npm run build && npm test

  package:
    name: Build (${{ matrix.platform }})
    needs: preflight
    permissions:
      contents: read   # least-privilege: builders only checkout + upload artifacts
    strategy:
      fail-fast: false   # a Windows/Linux failure must not abort the macOS build
      matrix:
        include:
          - os: macos-latest    # arm64
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            companion/package-lock.json
            chrome-extension/package-lock.json

      # package.sh runs `npm run build` in both dirs, so deps must be installed.
      # The companion postinstall (verify-systray2 + build-swift-tray) is
      # cross-platform safe — Swift build no-ops off macOS.
      - name: Install companion deps
        run: cd companion && npm ci

      - name: Install extension deps
        run: cd chrome-extension && npm ci

      - name: Install pinned NSIS (Windows official Setup.exe)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 -y --no-progress
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "makensis.exe missing after choco install nsis --version=3.12.0"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Package (${{ matrix.platform }})
        # package.sh: builds both projects, esbuild-bundles the companion,
        # sha256-verifies + downloads the target Node runtime, strips the
        # non-target systray2/node-notifier binaries, and zips the staging dir.
        # package.sh prefers Info-ZIP zip/unzip and falls back to 7-Zip on
        # windows-latest (Git Bash does not reliably ship zip/unzip); its tar
        # fallback chain handles BSD/libarchive tar on macOS/Windows.
        # P0-D: hard-fails if macOS host/tray, Windows host-scripts-win, or
        # qwen-vl-worker.py missing. Models/ORT are not package gates.
        # Windows: CMSPARK_REQUIRE_NSIS=1 — missing Setup.exe fails the job.
        shell: bash
        env:
          CMSPARK_REQUIRE_NSIS: ${{ matrix.platform == 'windows-x64' && '1' || '' }}
        run: bash scripts/package.sh ${{ matrix.platform }}

      # P0-D fail-closed content asserts — package.sh already gates at stage time;
      # these unzip checks catch regressions if staging paths drift.
      - name: Assert macOS zip has host + tray + scpt + qwen worker
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist-package/cmspark-*-macos-arm64.zip | head -1)"
          echo "Checking ${ZIP}..."
          unzip -l "${ZIP}" | grep -E 'cmspark-host$'
          unzip -l "${ZIP}" | grep -E 'cmspark-tray$'
          unzip -l "${ZIP}" | grep -E 'host-scripts/.*\.scpt$'
          unzip -l "${ZIP}" | grep -E 'qwen-vl-worker\.py'
          echo "macOS zip content assert OK"

      - name: Assert windows zip has host-scripts-win + qwen worker
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist-package/cmspark-*-windows-x64.zip | head -1)"
          echo "Checking ${ZIP}..."
          # 7z or unzip — windows-latest may lack unzip; package.sh already
          # produced the zip with 7z. Prefer unzip, fall back to 7z l.
          list_zip() {
            if command -v unzip >/dev/null 2>&1; then unzip -l "$1"
            else 7z l "$1"
            fi
          }
          list_zip "${ZIP}" | grep -E 'host-scripts-win/.*\.ps1'
          list_zip "${ZIP}" | grep -E 'qwen-vl-worker\.py'
          echo "windows-x64 zip content assert OK"

      - name: Assert linux zip has ORT napi + qwen worker + systray2 binary
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist-package/cmspark-*-linux-x64.zip | head -1)"
          echo "Checking ${ZIP}..."
          # Same list_zip helper shape as the windows assert; linux runners
          # always have unzip, but keep the fallback for symmetry.
          list_zip() {
            if command -v unzip >/dev/null 2>&1; then unzip -l "$1"
            else 7z l "$1"
            fi
          }
          list_zip "${ZIP}" | grep -E 'onnxruntime-node/bin/napi-[0-9]+/linux/x64/onnxruntime_binding\.node'
          list_zip "${ZIP}" | grep -E 'qwen-vl-worker\.py'
          list_zip "${ZIP}" | grep -E 'systray2/traybin/tray_linux_release$'
          echo "linux-x64 zip content assert OK"

      - name: Assert Windows Setup.exe exists
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(ls dist-package/CMspark-Setup-v*.exe | head -1)"
          echo "Checking ${EXE}..."
          test -s "${EXE}"
          echo "windows-x64 Setup.exe assert OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmspark-${{ matrix.platform }}
          path: dist-package/cmspark-*.zip
          if-no-files-found: error

      - name: Upload Windows Setup.exe
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: cmspark-windows-x64-setup
          path: dist-package/CMspark-Setup-v*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    # Only create a release for a real tag — workflow_dispatch dry-runs stop here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Emit SHA256SUMS (+ minimal SBOM notes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Flatten zips + Windows Setup.exe (must not use cmspark-*.exe —
          # official installer is CMspark-Setup-v*.exe).
          find artifacts -type f -name 'cmspark-*.zip' -exec cp -v {} dist-release/ \;
          find artifacts -type f -name 'CMspark-Setup-v*.exe' -exec cp -v {} dist-release/ \;
          cd dist-release
          if ! ls CMspark-Setup-v*.exe >/dev/null 2>&1; then
            echo "ERROR: CMspark-Setup-v*.exe missing after flatten — refuse zip-only release" >&2
            ls -la >&2 || true
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum cmspark-*.zip CMspark-Setup-v*.exe > SHA256SUMS
          else
            shasum -a 256 cmspark-*.zip CMspark-Setup-v*.exe > SHA256SUMS
          fi
          # REL-2: lightweight SBOM pointer (full CycloneDX deferred until signed tooling)
          {
            echo "# CMspark release checksums + SBOM notes"
            echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Full npm SBOM: run \`npm sbom --omit=dev\` in companion/ at this tag."
            echo "# Signing: Developer ID / Authenticode not yet applied (REL-1)."
            echo ""
            cat SHA256SUMS
          } > SHA256SUMS.txt
          cp SHA256SUMS.txt ../SHA256SUMS.txt
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist-release/*.zip
            dist-release/CMspark-Setup-v*.exe
            dist-release/SHA256SUMS
            dist-release/SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## CMspark ${{ github.ref_name }}

            Distributable zips (all platforms) plus a Windows NSIS Setup.exe.
            See
            [`docs/remediation-plan-2026-07-09.md`](https://github.com/nehcuh/cmspark/blob/main/docs/remediation-plan-2026-07-09.md)
            and [`docs/supply-chain.md`](https://github.com/nehcuh/cmspark/blob/main/docs/supply-chain.md).

            ### Downloads
            Each zip is **self-contained** for its platform — companion bundle,
            Chrome extension (`chrome-extension/`, load unpacked), Node runtime
            (sha256-verified against nodejs.org), builtin skills, and platform
            host/tray assets as listed below:

            | File | Platform | Platform-critical assets |
            |---|---|---|
            | `cmspark-v*-macos-arm64.zip` | macOS (Apple Silicon) | `cmspark-host`, `cmspark-tray`, `host-scripts/*.scpt`, `qwen-vl-worker.py` |
            | `cmspark-v*-linux-x64.zip` | Linux x64 | systray2 linux binary, `qwen-vl-worker.py` |
            | `cmspark-v*-windows-x64.zip` | Windows x64 | `host-scripts-win/*.ps1`, `qwen-vl-worker.py` |
            | `CMspark-Setup-v*.exe` | Windows x64 installer | Same files as the zip; per-user `%LOCALAPPDATA%\CMspark` |

            Packaging is **fail-closed** on platform-critical assets (aborts rather
            than shipping a zip that ENONTs at runtime):
            - **macos-arm64**: missing `cmspark-host`, `cmspark-tray`, or `host-scripts/*.scpt`
            - **all platforms**: missing `qwen-vl-worker.py` (Qwen3-VL experimental locate)
            - **windows-x64**: missing `host-scripts-win/*.ps1` **or** NSIS Setup.exe
            - **Windows Setup.exe**: wraps the same `package.sh` staging as the zip
              (`node.exe` + `cmspark-agent.js`). Missing `makensis` **fails** the
              Windows job (`CMSPARK_REQUIRE_NSIS=1`) rather than shipping zip-only.
            - **Qwen3-VL weights / Python env**: **not** packaged — download/preflight
              on demand under `~/.cmspark-agent/` (see `docs/qwen-vl-experimental-layer.md`).
              TinyClick/ORT are **not** ship requirements.

            ### Security notes (accurate as of this release)
            - **WS auth (audit C1)**: **FIXED** — origin allowlist + shared-secret
              HMAC handshake (`ws_secret` / challenge–response). Unauthenticated
              peers cannot drive the agent. Downstream docs must not claim the
              handshake is unfinished or postponed.
            - **Supply chain**: chrome-extension build-time advisories (plasmo/Parcel)
              are not shipped (`npm audit --omit=dev` = 0 on the extension runtime
              graph where applicable). See `docs/supply-chain.md`.
            - **Signing limits**: the bundled Node runtime is sha256-verified; app
              binaries are **not** Developer ID–codesigned / notarized / Authenticode-
              signed (pending certificates). macOS Gatekeeper / Windows SmartScreen
              may warn. **`CMspark-Setup-v*.exe` is unsigned** — SmartScreen / Smart
              App Control will prompt on first run. Ad-hoc signed `cmspark-host` /
              tray satisfy local TCC needs only — not Gatekeeper distribution trust.

            Full install steps: project `CLAUDE.md` / `Agents.md` Quick Start.
