name: Session save recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-session-save:
    name: Windows session persistence
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        working-directory: companion
        run: npm ci
      - name: Compile actual companion and test modules
        working-directory: companion
        run: npx tsc -p tsconfig.test.json
      - name: Real Windows conversation saves, atomic-write and MCP recovery
        working-directory: companion
        run: node scripts/run-tests.mjs .test-dist/tests/io-rename-windows-native.test.js .test-dist/tests/io-rename-recovery.test.js .test-dist/tests/mcp-error-hints.test.js .test-dist/tests/classify-by-code.test.js .test-dist/tests/config.test.js
