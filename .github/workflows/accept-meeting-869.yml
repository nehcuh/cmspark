name: Released Windows meeting acceptance
on:
  push:
    branches: [codex/meeting-v140-release-acceptance]
permissions:
  contents: read
jobs:
  meeting:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install Chromium in the disposable runner
        run: uv run --no-project --python 3.12 --with playwright==1.57.0 python -m playwright install chromium
      - name: Import the public recording and confirm minutes in the released extension
        run: uv run --no-project --python 3.12 --with playwright==1.57.0 python .github/meeting-869/prepare_release_case.py v1.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: released-meeting-acceptance
          path: |
            ${{ runner.temp }}/meeting-result/receipt.json
            ${{ runner.temp }}/meeting-result/transcript.txt
            ${{ runner.temp }}/meeting-result/minutes.md
          if-no-files-found: error
