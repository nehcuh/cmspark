name: macOS xcresult command qualification

on:
  push:
    branches: [codex/macos-native-timeout-101]
    paths: [.github/workflows/macos-xcresult-qualification.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - name: Inspect installed result-tool interface
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun xcresulttool --help
          xcrun xcresulttool get test-results tests --help
          xcrun xcresulttool get test-results test-details --help
