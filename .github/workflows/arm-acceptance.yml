name: ARM acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  affected-cpu:
    name: Affected CPU controls (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          sha256sum companion/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify runtime
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'arm64' || process.version !== 'v22.23.4') process.exit(1); console.log(process.platform, process.arch, process.version)"
      - name: Install locked companion dependencies
        working-directory: companion
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Check lockfile unchanged
        run: git diff --exit-code HEAD -- companion/package-lock.json
      - name: Typecheck companion and tests
        working-directory: companion
        run: ./node_modules/.bin/tsc -p tsconfig.test.json
      - name: Settings partial patch CPU controls
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap companion/.test-dist/tests/settings-partial-patches-806.test.js | tee "$RUNNER_TEMP/settings-partial-806-arm.tap"
          grep -Fx '# tests 11' "$RUNNER_TEMP/settings-partial-806-arm.tap"
          grep -Fx '# pass 11' "$RUNNER_TEMP/settings-partial-806-arm.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/settings-partial-806-arm.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/settings-partial-806-arm.tap"
      - name: Swift tray packaging CPU controls
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap companion/scripts/tests/swift-tray-package-pin.test.mjs companion/scripts/tests/swift-tray-bundle-entry.test.mjs companion/scripts/tests/swift-tray-source-freshness.test.mjs companion/scripts/tests/swift-tray-build-output.test.mjs companion/scripts/tests/swift-tray-package-copy.test.mjs | tee "$RUNNER_TEMP/tray-scripts-arm.tap"
          grep -Fx '# tests 17' "$RUNNER_TEMP/tray-scripts-arm.tap"
          grep -Fx '# pass 17' "$RUNNER_TEMP/tray-scripts-arm.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/tray-scripts-arm.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/tray-scripts-arm.tap"
          node --test --test-reporter=tap companion/.test-dist/tests/swift-tray-build-pin.test.js | tee "$RUNNER_TEMP/tray-consumer-arm.tap"
          grep -Fx '# tests 7' "$RUNNER_TEMP/tray-consumer-arm.tap"
          grep -Fx '# pass 7' "$RUNNER_TEMP/tray-consumer-arm.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/tray-consumer-arm.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/tray-consumer-arm.tap"
      - name: Qwen locator CPU controls
        working-directory: companion
        run: node --import tsx --test tests/computer-qwen-vl-locator.test.ts
      - name: Windows workflow contract CPU controls
        working-directory: companion
        run: node --test ../scripts/tests/windows-ci-feedback-750.test.mjs
      - name: MCP native listener passive controls
        working-directory: companion
        shell: bash
        run: |
          set -o pipefail
          pattern='^#476 (actual MCP listener projects only fixed post-auth request types|actual native finally preserves primary failure and all cleanup when diagnosticThrows=(false|true) (LF|CRLF))$'
          node --test --test-reporter=tap --test-name-pattern="$pattern" .test-dist/tests/desktop-native-receipts-476.test.js | tee "$RUNNER_TEMP/mcp-listener-arm.tap"
          grep -Fx '# tests 5' "$RUNNER_TEMP/mcp-listener-arm.tap"
          grep -Fx '# pass 5' "$RUNNER_TEMP/mcp-listener-arm.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/mcp-listener-arm.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/mcp-listener-arm.tap"
      # The three producer tests assert Darwin explicitly; the existing macOS
      # CI runs the entire file, including those three. Account for the 13
      # portable cases here so an empty or changed selection cannot pass.
      - name: Runtime header portable CPU controls
        shell: bash
        run: |
          set -o pipefail
          pattern='^(pinned fixture attributes and bytes are present|validated runtime header set is staged using exactly the verified bytes|an incomplete set falls back without publishing partial headers|a modified runtime header is refused before staging|missing input cannot hide a separate integrity failure|pin set cannot introduce extra or path-traversal members|separate staging calls never replace each others outputs|symlink and hardlink inputs are refused without staging|copy uses the verified buffer even if the input path changes after reading|corrupt existing archive cache is not bypassed by runtime preference|Windows preference keeps the original download route|macOS native header consumers only request members in the pinned set|unsafe or empty existing archive is refused without fetching)$'
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"),crypto=require("node:crypto");const s=fs.readFileSync("companion/scripts/tests/desktop-runtime-headers-480.test.mjs","utf8");assert.equal(crypto.createHash("sha256").update(s).digest("hex"),"eb3a7a2537a6f225164a440a9fadd64d2daeb567dfa997455e848505e7cc7045");const n=[...s.matchAll(/^test\(\x27([^\x27]+)\x27/gm)].map(x=>x[1]);const p=new RegExp(process.argv[1]);assert.equal(n.length,16);assert.equal(new Set(n).size,16);assert.equal(n.filter(x=>p.test(x)).length,13);assert.deepEqual(n.filter(x=>!p.test(x)),["actual macOS producer stages a controlled set of pinned headers without download","missing runtime headers use the original download path","archive appearing during runtime staging still receives original integrity check"])' "$pattern"
          node --test --test-reporter=tap --test-name-pattern="$pattern" companion/scripts/tests/desktop-runtime-headers-480.test.mjs | tee "$RUNNER_TEMP/header-arm.tap"
          grep -Fx '# tests 13' "$RUNNER_TEMP/header-arm.tap"
          grep -Fx '# pass 13' "$RUNNER_TEMP/header-arm.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/header-arm.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/header-arm.tap"
