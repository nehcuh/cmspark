name: Windows MCP 869 post-timeout diagnostic
on:
  push:
    branches: [codex/mcp-869-stack-probe]
permissions:
  contents: read
jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install and build current source
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Build native fixtures and compile the original test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-desktop-native.mjs --test-fixtures
          ./node_modules/.bin/tsc -p tsconfig.test.json
      - name: Verify collector source and projection
        run: node --test scripts/tests/mcp-stack-probe-826.test.mjs scripts/tests/mcp-stack-capture-826.test.cjs
      - name: Qualify CDB and run the original 20-second MCP case once
        env:
          CMSPARK_MCP_STACK_PROBE_826: '1'
        run: node scripts/mcp-stack-probe-826.mjs
      - name: Preserve only finite projected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stack-probe-869
          path: |
            ${{ runner.temp }}/mcp-stack-probe-826/qualification.json
            ${{ runner.temp }}/mcp-stack-probe-826/run.json
            ${{ runner.temp }}/mcp-stack-probe-826/capture.json
          if-no-files-found: warn
