name: Diagnostic 788 Windows 480 environment
on:
  push:
    branches: [codex/788-480-environment-probe]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned reviewed product tree
        uses: actions/checkout@v4
        with:
          ref: 653cb130b2d89a58a03f672c74815859a2946fe0
          path: product
          persist-credentials: false
      - name: Check out diagnostic controller
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Verify exact product identity
        shell: bash
        run: |
          test "$(git -C product rev-parse HEAD)" = 653cb130b2d89a58a03f672c74815859a2946fe0
          test "$(git -C product rev-parse HEAD^{tree})" = d2b75f34f46c5f64523371bdffaeed9f1d3d4b3d
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install and build original prerequisites
        shell: bash
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          set -euo pipefail
          cd product/companion
          npm ci
          npm run build
          node scripts/build-computer-uia-no-focus.mjs
          node scripts/build-computer-uia-native-probe-572.mjs
          node scripts/build-desktop-native.mjs --test-fixtures
          ./node_modules/.bin/tsc -p tsconfig.test.json
      - name: Verify tracked sources after build
        shell: bash
        run: |
          git -C product diff --quiet HEAD --
          git -C product diff --cached --quiet HEAD --
      - name: Compare actual 480 cases with two base environments
        shell: bash
        run: node controller/scripts/diagnostics/788-480-base-environments.mjs "$GITHUB_WORKSPACE/product"
