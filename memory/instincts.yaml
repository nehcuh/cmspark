# Instincts — auto-extracted reusable patterns
# Confidence: 0-1 (higher = more validated)

instincts:
  - id: l2-token-issue-validate-same-binding
    pattern: "危险工具 L2 token：issue 与 validate 必须同一 binding（issueTokenFor/validateTokenFor + bindingPayloadFor）。shell_exec 绑 command+cwd，netsec 绑 targets+ports。executeCompanionTool 里 validateToken(token, tool, bareCommand) 会在 enterprise_auto 下恒失败。改 binding 时全仓同步 + 单测 issue→validate。"
    confidence: 0.95
    source_session: "2026-08-09 S62 #161 shell_exec Invalid or expired security token"
    tags: [security, l2, shell_exec, netsec, token, enterprise]
    applications: 1

  - id: windows-sea-stop-before-restage
    pattern: "Windows 改 companion 后验收：先 Stop-Process cmspark-agent，再 build-windows-exe.ps1 或 Copy-Item 到 dist-package；否则 exe 锁导致 stage 失败或用户仍跑旧二进制。用 LastWriteTime 对照 companion/dist 与 dist-package。"
    confidence: 0.9
    source_session: "2026-08-09 S62 SEA restage file-in-use"
    tags: [windows, packaging, sea, deploy]
    applications: 1

  - id: unattended-means-full-silence-not-initial-only
    pattern: "无人值守武装（短语+双勾选）= 用户风险自担：host_computer 任务级 initial L2 与 mid-task reL2（含 PROMPT_ALWAYS danger/experimental/foreground）均应静默；硬拒绝仍 throw 无对话框。modelEnabled/experimental/credential latch 不得把值守打回弹窗。G1/巡航无 grant 时 PROMPT_ALWAYS 仍 force。文档/ADR/矩阵必须同步，禁止写「只免 initial / re-L2 仍确认」。"
    confidence: 0.95
    source_session: "2026-08-09 S61 #160 owner JTBD + adversarial×3 + dual both Merge YES"
    tags: [unattended, computer-use, trust, product-jtbd, adr-021]
    applications: 1

