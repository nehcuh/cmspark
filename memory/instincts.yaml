instincts:
  - id: dual-review-official-entrypoint-and-narrow-r2
    pattern: "dual-external-review 机核必须跑产品入口（companion npm test），不能只 node --test 单文件。JSDoc/块注释禁止写入 */ 序列（如 **/glob）。大 PR 全量 patch 易打爆 Claude context → r1 以能产出 VERDICT 的审阅方为准，r2 base 收窄到 blocker 修复 commit。Windows 用 Git Bash + PATH=/c/nvm4w/nodejs 跑 scripts/dual-external-review.sh。"
    confidence: 0.9
    source_session: "2026-08-09 S59–S60 health-fanout #159 dual r1 REJECT / r2 both_ok"
    tags: [dual-review, npm-test, windows, git-bash, ci]
    applications: 1

  - id: handlemessage-session-is-third-arg
