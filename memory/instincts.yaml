  - id: product-adr-conflict-offer-abc-then-implement
    pattern: "用户要求的场景能力与 ADR（如 Pack 禁 auto_approve）冲突时：陈述现状+风险，给出 A 可控 / B 全局 / C 仅引导 阶梯，等用户点选后再改代码与 ADR 修订；B 须 snapshot+unapply restore 且仅 user origin。"
    confidence: 0.8
    source_session: "2026-08-06 S46 scene Trust option B"
    tags: [product, adr, trust, packs]
    applications: 1

  - id: verify-race-before-locking
    pattern: "审计/评审提'竞态/需加锁'时,先确认是否存在 await 间隙。JS 单线程下,全同步的 read-modify-write(如 getConfig→deepMerge→writeFileSync 无 await)天然原子,不存在交错竞态;只有 caller'读→await→用陈旧快照写'才有竞态。别为不存在的竞态加 mutex(cargo-cult)。cmspark saveConfig 审计标 High 竞态,查证为非 bug。"
    confidence: 0.8
    source_session: "2026-07-10 P1-3 saveConfig H5 查证"
    tags: [concurrency, race-condition, javascript, single-thread, mutex, verify]
    applications: 1

  - id: kimi-gate-catches-real-issues
    pattern: "对每处改动跑 kimi 独立终审($KIMI -p \"$(<difffile)\")常拦下真问题:kimi 实测/独立验证比纯推理准。本轮拦下:zip-slip 预检用 adm-zip(读写都规范化..→失效)、{...defaultConfig} 浅拷贝污染默认、build 脚本未关门。同时要敢于反驳 kimi 的过度建议(如对全同步函数要求加锁/await)。采纳前验证,错的反驳。"
    confidence: 0.75
    source_session: "2026-07-10 4 PR 的 kimi 终审"
    tags: [kimi, code-review, verification, methodology, pushback]
    applications: 4

  - id: layered-skip-algebra-before-ux
    pattern: "多层安全跳过(allowlist / task auth / forceConfirm / god-mode / session-trust)必须先写清代数再改 UX。cmspark enterprise: allowlist≠跳过 L2; mustInteract = (!skipConfirmation || forceConfirm) && !hostComputerTrustSkip && !enterpriseSkip。新开关独立命名(auto_approve_enterprise_tools vs auto_approve_dangerous), pack-forbidden, 交互 grant 才续期。"
    confidence: 0.85
    source_session: "2026-07-27 enterprise A+B netsec UX"
    tags: [security, gate-algebra, enterprise, confirmation, ux]
    applications: 1

  - id: health-file-needs-pid-liveness
    pattern: "文件心跳/ready.json 健康检查必须附进程 liveness(PID alive)。死进程留下的 tombstone 会用陈旧 mtime 伪装 healthy,导致 heartbeat stale 达数天。读 ready 时清死 PID;spawn 前再清。Windows estop ready.json 即此坑。"
    confidence: 0.9
    source_session: "2026-07-28 windows estop tombstone"
    tags: [windows, process, heartbeat, tombstone, estop]
    applications: 2

