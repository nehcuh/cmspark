  - id: broadcast-delegation
    pattern: "When server needs to trigger action in a different client, broadcast a start message to all clients and let the target client initiate its own request. This avoids modifying shared pipelines for cross-client routing."
    confidence: 0.7
    source_session: "2026-06-09 quick actions simplification"
    tags: [architecture, websocket, cross-client]
    applications: 1

  - id: ws-response-id-pairing
    pattern: "WebSocket 请求/响应必须用唯一 id 配对;响应的 type 字段不能复用为 push 订阅条件,否则响应会触发同名请求形成死循环。daemon 端响应应回显请求 id,客户端优先按 id 匹配 pending 再分发剩余消息。"
    confidence: 0.8
    source_session: "2026-06-28 tray↔daemon skill.list 死循环修复"
    tags: [websocket, bug, request-response, loop]
    applications: 1

  - id: parallel-audit-fanout-then-verify
    pattern: "对大规模代码审计/审查:按维度簇(安全/前端/后端/发布等)fan-out 并行 general-purpose 子代理,每个深读相关文件返回 file:line 级结构化 findings(issue-card 格式);主会话对 Critical/High 论断做对抗性复核——直接 Read 源码确认,避免子代理误报导致虚高评分;再综合打分(判断非扣分,按系统性 vs 孤立)。子代理做广度,主会话保准确度。CMspark post-ship 用 Security/Correctness/Architecture/Compat 四路同样有效。"
    confidence: 0.75
    source_session: "2026-07-09 Fuck My Shit Mountain 全量审计; 2026-08-05 S45 multi-lane"
    tags: [audit, review, parallel-agents, adversarial-verify, evidence, multi-lane]
    applications: 3

  - id: mapbusy-always-chrome-gated
    pattern: "双拓扑乐观 busy：per-thread mapBusy 必须按事件 thread_id 无条件 set/clear；面板 chrome(isProcessing/ADD_MESSAGE/streaming) 必须 shouldApplyStreamEvent 门控。只清全局 isProcessing 会在切线程后污染/假解锁。错误若门控掉 UI 气泡，companion 须 persist 到线程消息。"
    confidence: 0.85
    source_session: "2026-08-05 S45 upload cross-thread + #125"
    tags: [websocket, busy, thread-isolation, ui, dual-topology]
    applications: 1

  - id: windows-dual-review-without-wsl
    pattern: "Windows 无 WSL 时勿依赖 WSL bash；用 Git Bash (`Program Files/Git/bin/bash.exe`) + PATH=/c/nvm4w/nodejs 跑 dual-external-review.sh，或 claude -p + pi -p 并行 Job。PowerShell 重定向默认 UTF-16 需 UTF-8；commit message 用 -F 文件。勿用 system32 bash 当 WSL 未装时会空转。"
    confidence: 0.9
    source_session: "2026-08-05 S45; 2026-08-06 S46; 2026-08-09 S59 Git Bash dual #159"
    tags: [windows, powershell, dual-review, tooling, git-bash]
    applications: 3

  - id: autonomy-must-cover-all-l2-dialects
    pattern: "用户开『全自动巡航/全授权』后仍弹确认：先查日志是哪条门（shell enterprise_auto_approved vs mcp.confirm.requested）。Autonomy 三旗必须覆盖 Companion critical 与 MCP forceMcpConfirm/meta 等所有 L2 方言，否则产品撒谎。不要用模型话术『每次 shell 都要确认』当真相。"
    confidence: 0.85
    source_session: "2026-08-06 S46 #pl5bud MCP write vs shell"
    tags: [security, autonomy, mcp, l2, product]
