    {id:'vendor',title:'跟进供应商补充材料',app:'企业内聊',group:'供应商接入专项',from:'刘宁',due:'明天 11:00',status:'等待他人',kind:'supervise',feedback:'收齐材料后更新专项群',quote:'补充材料明天上午十一点前给你，收到后辛苦在专项群同步一下。',time:'10月21日 10:26',reminder:'明天 10:00 跟进',progress:'等待刘宁补充材料',needsReply:true},

    {id:'c1',title:'整理下周评审材料',group:'钉钉 · 工作助手产品讨论',from:'周然',quote:'下周评审前咱们把材料整理一下。',question:'执行人和具体截止时间待确认'},
    {id:'c2',title:'核对报表口径',group:'企业内聊 · 数据分析沟通群',from:'陈悦',quote:'这部分口径可能还要再核对，先记一下。',question:'是否由本人负责待确认'}
  ];
  const samples = {
    quiet:{text:'少打扰我，但别漏掉重要待办',summary:'你希望降低提醒频率，同时保留关键事项的及时提醒。',plans:[
      {name:'重要事项即时提醒',tag:'推荐',why:'保留临期和督办提醒，普通事项集中汇总。',changes:[['普通事项提醒','即时','每天 09:00 汇总','只调整普通提醒；重要和临期事项保持即时。'],['免打扰时段','未设置','22:00–08:00','时区为 Asia/Shanghai；关键提醒是否例外可单独设置。']]},
      {name:'每天两次集中处理',tag:'更安静',why:'按固定时间处理事项，减少工作中的打断。',changes:[['普通事项提醒','即时','09:00 / 16:00 汇总','临近截止时仍按事项单独的提醒规则提示。']]},
      {name:'只提醒临期事项',tag:'最少打扰',why:'只保留即将到期的提醒，其余到待办页查看。',changes:[['普通事项提醒','即时','仅在临期时通知','可能更晚注意到没有截止日期的事项。']]}
    ]},
    privacy:{text:'聊天截图不要发送给云端',summary:'你希望约束聊天内容的处理范围；仅把图片留在本机还不够。',plans:[
      {name:'严格本地处理',tag:'隐私优先',why:'图片、OCR 文本和语义抽取都留在本机。',prereq:'需要可用的本地语义模型；本示例未安装。',changes:[['聊天内容处理','当前模型服务','仅本机','没有本地模型时暂停语义抽取，不能退回云端。']]},

      {name:'使用本机识别',tag:'需要准备',why:'尝试本地 Whisper，先核对设备与模型是否可用。',prereq:'需要单独下载模型并启用本机转写。',changes:[['听写方式','浏览器识别','本机 Whisper','先完成下载，再明确启用；不声称一定比当前引擎更准。']]},
      {name:'先检查输入设备',tag:'无需更换模型',why:'噪声或选错麦克风也可能导致错字。',navigate:true,changes:[['输入设备','当前系统设备','打开设备检查','只打开对应设置，不写入配置。']]}
    ]}
  };
  const settingsCategories=['模型与推理','输入与语音','待办与提醒','记录与隐私','文件与知识','连接与配对','安全与信任','本机与工具','密钥与环境','实验功能'];
  const instances=[];
  function make(id, variant){
    const el=document.getElementById(id);
    const s={view:variant==='tasks'?'today':variant==='settings'?'settings':'chat',variant,menu:false,filter:'all',selected:'report',detail:false,edit:false,edits:{},settingsTab:'待办与提醒',sample:'quiet',phrase:samples.quiet.text,result:variant==='settings'?'quiet':null,chosen:0,preview:variant==='settings',apply:'idle',checked:variant==='settings'?[0,1]:[],done:new Set(),feedback:new Set(),accepted:new Set(),ignored:new Set(),extra:[],review:null,paused:false,source:false,notice:'',history:[],prefs:{},backup:null};
    instances.push({el,s});
    const btn=(text,action,cls='',extra='')=>`<button type="button" class="cm-button cursor-interaction ${cls}" data-action="${action}" ${extra}>${text}</button>`;
    const unresolved=()=>candidates.filter(x=>!s.accepted.has(x.id)&&!s.ignored.has(x.id));
    const allTasks=()=>[...tasks,...s.extra].map(t=>({...t,...s.edits[t.id]}));
    function navItems(){const items=s.variant==='chat'?[['today','今日','calendar-days'],['chat','对话','message-square'],['todos','待办','list-todo'],['library','资料','folder-open'],['capture','活动记录','scan-line']]:[['today','今日','calendar-days'],['todos','待办','list-todo'],['chat','对话','message-square'],['library','资料','folder-open'],['capture','活动记录','scan-line']];return items.map(([view,label,ico])=>`<button type="button" class="cm-nav-item cursor-interaction ${s.view===view?'is-active':''}" data-action="nav:${view}" ${s.view===view?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${view==='todos'&&unresolved().length?`<span class="cm-count">${unresolved().length}</span>`:''}</button>`).join('');}
    function title(name,sub,action=''){return `<div class="cm-title-row"><div><h1>${name}</h1>${sub?`<p class="cm-subtitle">${sub}</p>`:''}</div>${action}</div>`;}
    function detail(t){

      const field=(key,label,value)=>`<label for="${id}-edit-${key}">${label}<input id="${id}-edit-${key}" class="cm-input" value="${esc(value)}"></label>`;

    }
    function taskList(){
      if(s.filter==='inbox')return `<div class="cm-main-list"><div class="cm-section-heading"><h2>待整理</h2><span class="cm-caption">${unresolved().length} 条候选</span></div>${unresolved().map(t=>`<article class="cm-resource"><h3>${esc(t.title)}</h3><p>${esc(t.group)} / ${esc(t.from)}</p><blockquote class="cm-quote">${esc(t.quote)}</blockquote><p>${esc(t.question)}</p>${s.review===t.id?`<div><label class="cm-caption" for="${id}-owner">执行人</label><input id="${id}-owner" class="cm-input" value="" placeholder="请明确填写执行人"><label class="cm-caption" for="${id}-deadline">截止时间（可留空）</label><input id="${id}-deadline" class="cm-input" placeholder="核对原文后填写具体时间"><label class="cm-caption" for="${id}-feedback">反馈位置或要求</label><input id="${id}-feedback" class="cm-input" value="${esc(t.group)}"><div class="cm-inline" style="margin-top:12px">${btn('确认并加入',`save-candidate:${t.id}`,'primary small')}${btn('取消整理','cancel-review','small')}</div></div>`:`<div class="cm-inline">${btn('核对并加入',`accept:${t.id}`,'small')}${btn('忽略',`ignore:${t.id}`,'quiet small')}</div>`}</article>`).join('')||'<div class="cm-empty">候选已整理完。新识别的事项会出现在这里。</div>'}</div>`;

    }
    function todos(){const t=allTasks().find(x=>x.id===s.selected)||tasks[0];return title(s.view==='today'?'今日':'待办',s.view==='today'?'10月21日，星期三 · 先处理有明确时限的事项':'每项保留提出人、原文、截止时间与反馈去向',btn('新增事项','new','small'))+`${unresolved().length?`<div class="cm-pending"><div><h3>${unresolved().length} 条候选待整理</h3><small>来自你看过的对话，尚未进入正式清单</small></div>${btn('去整理','inbox','small')}</div>`:''}<div class="cm-filters" aria-label="待办筛选">${[['all','全部'],['mine','我的待办'],['supervise','我督办的'],['waiting','等待反馈'],['done','已处理']].map(([k,l])=>`<button type="button" class="cm-filter cursor-interaction ${s.filter===k?'is-active':''}" data-action="filter:${k}" aria-pressed="${s.filter===k}">${l}</button>`).join('')}</div><div class="cm-split">${taskList()}${s.filter!=='inbox'?detail(t):'<aside class="cm-detail"><h2>先核对，再加入</h2><p class="cm-caption">请求不一定等于你的承诺。无法识别的责任人或时间留作待确认，忽略过的事项不应反复出现。</p></aside>'}</div>`;}
    function chat(){return title('对话',s.variant==='side'?'当前网页与个人事项，随时接着聊':'查资料、做工作，也可以继续追踪事项',s.variant==='side'?'':btn('新对话','new-chat','small'))+`<div class="cm-chat-layout"><div class="cm-chat-body"><div class="cm-user-msg">今天还有哪些事情需要我反馈？</div><div class="cm-answer"><p>有两项需要今天反馈，建议先处理灰度验证报告。</p><ul><li><strong>17:00 前</strong>，将验证报告发到支付项目交付群，并 @王经理。</li><li><strong>18:00 前</strong>，在客户接口联调群确认周五排期。你还在等待研发回复。</li></ul><p class="cm-caption">以上来自已确认待办。消息中的要求和你的处理状态分别保留。</p><button type="button" class="cm-source-chip cursor-interaction" data-action="select:report">${icon('quote')}王经理 · 支付项目交付群</button><button type="button" class="cm-source-chip cursor-interaction" data-action="select:review">${icon('quote')}陈悦 · 客户接口联调群</button></div>${s.variant==='side'?`<div class="cm-pending"><div><h3>今天 17:00 · 提交验证报告</h3><small>反馈到支付项目交付群</small></div>${btn('查看','select:report','small')}</div>`:''}<div class="cm-composer"><label class="cm-caption" for="${id}-composer">发消息</label><textarea id="${id}-composer" placeholder="描述你要完成的事，或添加网页和文件…"></textarea><div class="cm-composer-bottom"><div class="cm-composer-meta"><button type="button" data-action="context" aria-label="添加上下文">${icon('plus')}</button><button type="button" data-action="capabilities">能力</button><span>当前模型</span></div>${btn(icon('arrow-up')+'发送','send','primary small')}</div></div><div class="cm-caption">示例对话 · 输入仅用于演示反馈，不会发送给模型</div></div><aside class="cm-conversation-list"><h3>最近对话</h3><button type="button" data-action="conversation">项目交付与反馈<small>今天 · 当前对话</small></button><button type="button" data-action="conversation">接口联调资料整理<small>昨天 · 2 份资料</small></button><button type="button" data-action="conversation">工作助手需求讨论<small>10月19日</small></button>${btn('管理全部对话','manage-chats','quiet small')}<div class="cm-note">执行记录和 Agent 任务留在对应对话中。</div></aside></div>`;}
    function library(){return title('资料','保留工作材料，也保留材料的来源')+`<div class="cm-resource-grid">${[['知识','整理的笔记、知识条目和关联图谱','知识列表 / 知识图谱','book-open'],['会议','录音、转写、参考笔记和会议纪要','开始会议 / 导入音频','mic'],['文件','对话中上传、生成和导出的文件','查看文件','file-text'],['浏览器标签页','为当前对话选取网页上下文','选择网页','panels-top-left']].map(([n,d,a,ico])=>`<article class="cm-resource"><div class="cm-inline">${icon(ico)}<h2>${n}</h2></div><p>${d}</p>${btn(a,`resource:${n}`,'quiet small')}</article>`).join('')}</div><div class="cm-note">技能、场景与专家、MCP 和应用在“设置 → 本机与工具”中管理；对话保留本次使用的快捷入口。</div>`;}
    function capture(){return title('活动记录','只记录已启用应用中可采集到的画面',btn(s.paused?'恢复记录':'暂停记录','pause',s.paused?'primary':''))+`<div class="cm-note ${s.paused?'warning':'success'}"><span class="cm-dot ${s.paused?'paused':''}"></span>${s.paused?'记录已暂停。暂停期间的对话不会补采。':'正在记录 · 最近一次成功采集 11:08 · 本机 OCR'}</div>${[['钉钉','已启用 · 当前打开的会话画面','11:08'],['微信','已启用 · 当前打开的会话画面','10:02'],['企业内聊','未启用 · 添加应用后可配置','尚无记录']].map(([n,d,t])=>`<div class="cm-source-row"><div><h2>${n}</h2><p>${d}</p></div><span class="cm-caption">${t}</span></div>`).join('')}<div class="cm-note">采集范围不包含未打开、未加载的消息。窗口最小化或遮挡时是否可采集，需要按应用验证。</div><div class="cm-inline" style="margin-top:20px">${btn('配置采集与隐私','capture-settings')}${btn('查看候选事项','inbox')}</div>`;}
    function manualRows(){const map={
      '待办与提醒':[['普通事项提醒',s.prefs['普通事项提醒']||'即时','已确认事项的提醒频率'],['免打扰时段',s.prefs['免打扰时段']||'未设置','以设备时区为准'],['逾期提醒','每天 09:00','已完成和已取消的事项停止提醒']],
      '输入与语音':[['听写方式',s.prefs['听写方式']||'浏览器识别','本机模型需下载后单独启用'],['ASR 纠错',s.prefs['ASR 纠错']||'关闭','查看转写内容会由哪个模型服务处理'],['实时出字','开启','边说边显示识别中的文字']],
      '记录与隐私':[['启用的应用','钉钉、微信','仅采集可获得的窗口画面'],['聊天内容处理',s.prefs['聊天内容处理']||'当前模型服务','本机 OCR 与语义模型的数据范围分开说明'],['后台语义抽取',s.prefs['后台语义抽取']||'开启','暂停后不再生成新的候选事项']],
      '模型与推理':[['对话模型','当前已配置模型','能力和服务状态需要读取真实配置'],['推理预算','标准','仅为支持该能力的模型提供选项']],
      '连接与配对':[['Companion 连接','已连接（示例）','配对和信任确认保留独立流程']],
      '安全与信任':[['操作确认','沿用当前策略','AI 候选不能自动批准权限或操作']],
      '本机与工具':[['技能 / 场景与专家','查看与管理','与当前对话启用的能力分开'],['MCP / 应用','查看与管理','连接、安装和授权分别确认']],
      '密钥与环境':[['密钥条目','••••••••','真实密钥不进入语义推荐上下文']],
      '文件与知识':[['附件与知识索引','沿用当前设置','保留导入、导出和知识管理入口']],
      '实验功能':[['实验能力','按项启用','模型许可、下载与启用分别处理']]
    };return `<div class="cm-manual"><div class="cm-section-heading"><h2>${esc(s.settingsTab)}</h2><span class="cm-caption">也可直接浏览设置</span></div>${(map[s.settingsTab]||[]).map(([a,b,c])=>`<div class="cm-manual-row"><div><h3>${esc(a)}</h3><p>${esc(c)}</p></div><button type="button" class="cm-value cursor-interaction" data-action="manual:${esc(a)}">${esc(b)} ›</button></div>`).join('')}</div>`;}
    function settings(){const result=s.result&&samples[s.result];let resultHtml='';
      if(s.result==='clarify'){resultHtml=`<div class="cm-note">这个描述有多种可能。正式版会基于实际设置澄清；此设计稿请选择一个示例场景体验候选流程。</div>`;}
      else if(s.result==='offline'){resultHtml=`<div class="cm-note error" role="alert">模型暂不可用，未生成语义候选。手动设置仍可使用。${btn('重试','retry','quiet small')}</div>`;}
      else if(result){const plan=result.plans[s.chosen];resultHtml=`<div class="cm-section-heading"><div><h2>可能符合你需求的方案</h2><p class="cm-subtitle">${esc(result.summary)}</p></div></div><div class="cm-candidates">${result.plans.map((p,i)=>`<article class="cm-plan ${s.chosen===i?'is-chosen':''}"><span class="cm-plan-tag">${s.chosen===i?icon('circle-check'):icon('circle')}${esc(p.tag)}</span><h3>${esc(p.name)}</h3><p>${esc(p.why)}</p><ul>${p.changes.map(c=>`<li>${esc(c[0])}：${esc(c[2])}</li>`).join('')}</ul>${btn(s.chosen===i?'已选 · 查看变更':'选择并查看变更',`plan:${i}`,'small')}</article>`).join('')}</div>${s.preview?`<div class="cm-preview-diff"><div class="cm-section-heading"><h2>应用前核对</h2><span class="cm-caption">${plan.changes.length} 项候选变更</span></div>${plan.changes.map((c,i)=>`<label class="cm-change-row"><input type="checkbox" data-change="${i}" ${s.checked.includes(i)?'checked':''}><span>${esc(c[0])}<small>${esc(c[3])}</small></span><span class="cm-change-value"><span>当前：${esc(s.prefs[c[0]]||c[1])}</span>建议：${esc(c[2])}</span></label>`).join('')}${plan.prereq?`<div class="cm-note warning">${esc(plan.prereq)} 该步骤需单独操作，当前不能直接应用。${btn('查看准备步骤','prerequisite','quiet small')}</div>`:''}${s.apply==='failed'?'<div class="cm-note error" role="alert">演示：保存失败。候选和草稿已保留，尚未标记为生效。</div>':''}${s.apply==='success'?`<div class="cm-note success" role="status">演示：已更新 ${s.checked.length} 项预览设置。真实配置未改变。${btn('撤销预览变更','undo','quiet small')}</div>`:`<div class="cm-apply-row"><span class="cm-caption">${plan.navigate?'此方案只打开设置，不写入配置':'仅应用你选中的项目'}</span>${btn(s.apply==='pending'?'正在核对…':plan.navigate?'打开对应设置':plan.prereq?'需先完成准备':'确认应用（演示）','apply','primary',plan.prereq||!s.checked.length||s.apply==='pending'?'disabled':'')}</div>`}</div>`:''}`;}
      return title('设置','说清你希望改善的体验，或直接浏览具体设置')+`<div class="cm-intent"><label for="${id}-intent">你希望 CMspark 怎样工作？</label><form class="cm-intent-row" data-form="intent"><input id="${id}-intent" class="cm-input" value="${esc(s.phrase)}" placeholder="例如：少打扰我，但别漏掉重要待办" autocomplete="off"><button class="cm-button primary cursor-interaction" type="submit">${icon('sparkles')}理解并给出候选</button></form><div class="cm-examples">${Object.entries(samples).map(([k,v])=>`<button type="button" class="cm-example cursor-interaction" data-action="sample:${k}">${esc(v.text)}</button>`).join('')}</div><p class="cm-caption" style="margin-top:11px">交互演示：使用预设候选；正式版结合真实设置目录、当前值和可用能力进行 AI 理解。</p></div>${resultHtml}<div class="cm-settings-tabs" style="margin-top:28px" aria-label="设置分类">${settingsCategories.map(x=>`<button type="button" class="cm-filter cursor-interaction ${s.settingsTab===x?'is-active':''}" data-action="category:${x}" aria-pressed="${s.settingsTab===x}">${x}</button>`).join('')}</div>${manualRows()}`;
    }
    function render(){
      el.dataset.detail=s.detail?'true':'false';
      el.innerHTML=`<div class="cm-shell"><nav class="cm-nav" aria-label="主导航"><div><div class="cm-brand">${icon('command')}CMspark</div><div class="cm-scope">个人工作空间</div></div><div class="cm-nav-group">${navItems()}</div><div class="cm-nav-group"><div class="cm-nav-label">继续工作</div><button type="button" class="cm-nav-item cursor-interaction" data-action="nav:chat">${icon('message-circle')}项目交付与反馈</button></div><div class="cm-nav-bottom"><button type="button" class="cm-nav-item cursor-interaction ${s.view==='settings'?'is-active':''}" data-action="nav:settings">${icon('settings-2')}设置</button><div class="cm-capture-foot"><span><span class="cm-dot ${s.paused?'paused':''}"></span>${s.paused?'记录已暂停':'记录已开启'}</span><button type="button" data-action="pause" aria-label="${s.paused?'恢复记录':'暂停记录'}">${icon(s.paused?'play':'pause')}</button></div></div></nav><section class="cm-sheet"><header class="cm-top"><div class="cm-top-left"><button type="button" class="cm-mobile-menu cursor-interaction" data-action="menu" aria-expanded="${s.menu}">${icon('menu')}<span>CMspark</span></button><span>${s.variant==='side'?'浏览器侧栏':'个人工作空间'}</span></div><div class="cm-top-right"><span class="cm-scope-label">${s.paused?'记录已暂停':'本机已连接'}</span><button type="button" data-action="${s.variant==='side'?'full':'nav:settings'}">${icon(s.variant==='side'?'expand':'settings-2')}<span>${s.variant==='side'?'工作中心':'设置'}</span></button></div></header>${s.menu?`<nav class="cm-mobile-nav" aria-label="展开的主导航">${navItems()}${btn('设置','nav:settings','small')}</nav>`:''}<main class="cm-content">${s.view==='settings'?settings():s.view==='chat'?chat():s.view==='library'?library():s.view==='capture'?capture():todos()}${s.notice?`<div class="cm-note" role="status">${esc(s.notice)}</div>`:''}<div class="cm-live" aria-live="polite"></div></main></section></div>`;
      el.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
      const form=el.querySelector('[data-form="intent"]');if(form)form.addEventListener('submit',e=>{e.preventDefault();s.phrase=el.querySelector('#'+id+'-intent').value;s.result=design.service==='offline'?'offline':Object.keys(samples).find(k=>samples[k].text===s.phrase.trim())||'clarify';s.chosen=0;s.preview=!!samples[s.result];s.checked=samples[s.result]?samples[s.result].plans[0].changes.map((_,i)=>i):[];s.apply='idle';s.notice='';render();});
      el.querySelectorAll('[data-change]').forEach(c=>c.addEventListener('change',()=>{const i=+c.dataset.change;s.checked=c.checked?[...s.checked,i]:s.checked.filter(x=>x!==i);s.apply='idle';render();}));
      if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}});
    }
    function action(a){const [k,v]=a.split(':');s.notice='';
      if(k==='nav'){s.view=v;s.detail=false;s.menu=false;s.source=false;}
      else if(k==='menu')s.menu=!s.menu;
      else if(k==='select'){s.selected=v;s.view='todos';s.filter='all';s.detail=true;s.source=false;}
      else if(k==='back')s.detail=false;
      else if(k==='edit'){s.edit=true;s.detail=true;}
      else if(k==='cancel-edit')s.edit=false;
      else if(k==='save-task'){const owner=el.querySelector('#'+id+'-edit-owner').value.trim();if(!owner){s.notice='请先填写执行人。';}else{s.edits[s.selected]={owner,due:el.querySelector('#'+id+'-edit-due').value.trim()||'未设置',reminder:el.querySelector('#'+id+'-edit-reminder').value.trim()||'未设置',feedback:el.querySelector('#'+id+'-edit-feedback').value.trim()||'待确认'};s.edit=false;s.notice='演示：事项信息已更新；真实提醒计划未建立。';}}
      else if(k==='filter'){s.filter=v;s.detail=false;}
      else if(k==='inbox'){s.view='todos';s.filter='inbox';s.detail=false;}
      else if(k==='source')s.source=!s.source;
      else if(k==='done'){s.done.has(s.selected)?s.done.delete(s.selected):s.done.add(s.selected);s.notice='演示：处理状态已更新，反馈状态保持独立。';}
      else if(k==='feedback'){s.feedback.has(s.selected)?s.feedback.delete(s.selected):s.feedback.add(s.selected);s.notice='演示：已记录你的反馈状态，未向聊天工具发送消息。';}
      else if(k==='accept'){s.review=v;}
      else if(k==='cancel-review'){s.review=null;}
      else if(k==='save-candidate'){const t=candidates.find(x=>x.id===v);const owner=el.querySelector('#'+id+'-owner').value.trim();const due=el.querySelector('#'+id+'-deadline').value.trim();const feedback=el.querySelector('#'+id+'-feedback').value.trim();if(!owner){s.notice='请先确认执行人。';}else{s.accepted.add(v);s.extra.push({id:v,owner,title:t.title,app:t.group.split(' · ')[0],group:t.group.split(' · ')[1],from:t.from,due:due||'未设置',status:'待处理',kind:owner==='我'?'mine':'supervise',feedback:feedback||'待确认',quote:t.quote,time:'消息时间待核对',reminder:due?'待设置提醒':'未设置',progress:'已由用户整理并确认',needsReply:!!feedback});s.review=null;s.filter='all';s.selected=v;s.detail=true;s.notice='演示：已加入正式清单。未填写的时间保持未设置，不自动猜测。';}}
      else if(k==='ignore')s.ignored.add(v);
      else if(k==='pause'){s.paused=!s.paused;}
      else if(k==='capture-settings'){s.view='settings';s.settingsTab='记录与隐私';}
      else if(k==='category')s.settingsTab=v;
      else if(k==='sample'){s.sample=v;s.phrase=samples[v].text;s.result=null;s.preview=false;s.apply='idle';}
      else if(k==='plan'){s.chosen=+v;s.preview=true;s.apply='idle';s.checked=samples[s.result].plans[s.chosen].changes.map((_,i)=>i);}
      else if(k==='apply'){const plan=samples[s.result].plans[s.chosen];if(plan.navigate){s.settingsTab='输入与语音';s.notice='演示：已打开输入与语音设置，未修改配置。';}else if(!plan.prereq&&s.checked.length){s.backup={...s.prefs};s.apply='pending';render();setTimeout(()=>{s.apply=design.service==='save-fail'?'failed':'success';if(s.apply==='success'){for(const i of s.checked){const c=plan.changes[i];s.prefs[c[0]]=c[2];}}render();},550);return;}}
      else if(k==='undo'){s.prefs={...s.backup};s.apply='idle';s.notice='演示：预览设置已恢复。';}
      else if(k==='retry'){design.service='normal';s.result=null;s.notice='演示：服务已恢复，可再次生成候选。';}
      else if(k==='full'){s.notice='正式产品将在独立页面打开完整工作中心；可切换下方“事项优先”查看。';}
      else if(k==='context'){s.notice='上下文入口：浏览器标签页、文件、知识、其他对话。';}
      else if(k==='capabilities'){s.notice='本次对话能力：技能、场景与专家、MCP、应用。全局管理位于设置。';}
      else if(k==='send'){s.notice='这是交互设计稿。输入未发送给模型，真实对话未改变。';}
      else if(k==='prerequisite'){s.notice='需单独检查能力、下载模型和授权；正式流程沿用现有确认机制。';}
      else if(k==='manual'){s.notice=`“${v}”的手动设置入口；此稿不修改真实配置。`;}
      else if(k==='manage-chats'){s.notice='完整管理保留：搜索、标签/分组、重命名、归档、回收站与批量操作。';}
      else if(k==='resource'){s.notice=`${v}入口保留；详细工作流沿用现有功能。`;}
      else if(k==='new'||k==='new-chat'){s.notice=k==='new'?'新增事项时填写内容、责任人、时间、反馈去向；此处为设计入口。':'新对话入口；此处为设计预览。';}
      else if(k==='conversation'){s.notice='切换对话时，执行状态与结果继续归属原对话。';}
      render();
    }
    return {el,s,render};
  }
  const design={dark:false,dense:false,service:'normal'};
  const apps=[make('cm-task-first','tasks'),make('cm-settings-preview','settings'),make('cm-chat-first','chat'),make('cm-browser-side','side')];
  function updateDesign(){for(const a of apps){a.el.dataset.theme=design.dark?'dark':'light';a.el.style.setProperty('--cm-pitch',design.dense?'60px':'70px');a.render();}}
  updateDesign();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:updateDesign});tweak.addToggle(design,'dark',{label:'深色外观'});tweak.addToggle(design,'dense',{label:'紧凑事项列表'});tweak.addSelect(design,'service',{label:'设置流程情景',options:[{label:'正常演示',value:'normal'},{label:'模型不可用',value:'offline'},{label:'保存失败',value:'save-fail'}]});}
})();
</script>
