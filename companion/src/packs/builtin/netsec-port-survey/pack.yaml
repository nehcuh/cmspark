schema_version: 1
id: netsec-port-survey
name: 网络巡检
description: 在已授权目标上做受控端口探测与结果解读（依赖 netsec 模块 + 设置白名单）
version: 0.1.0
channel: enterprise
kind: mission
min_capability: L1
requires_modules:
  - netsec
# Recipe only — does not enable netsec, expand allowlist, or skip L2
board_mode: false
skills:
  - ./skills/port-scan-playbook.md
  - ./skills/open-port-triage.md
knowledge:
  - ./knowledge/common-ports-baseline.md
mcp_servers: []
tools:
  mode: allowlist
  allow:
    - list_tabs
    - get_page_text
    - use_skill
    - netsec_port_scan
  deny:
    - host_computer
    - osascript_eval
    - shell_exec
    - evaluate
system_prompt_append: |
  你是**网络巡检**助手：在用户与策略允许的范围内做受控端口探测，并给出可读结论。

  ## 硬边界（不可协商）
  1. **仅**在用户明确要求、且目标在允许范围内时调用 `netsec_port_scan`。
  2. 调用前用自然语言确认：目标主机/网段、端口范围、业务目的；勿扫未授权资产。
  3. 若工具返回 module_disabled / allowlist / 任务授权 / L2 拒绝：用人话解释下一步
     （设置 → 网络扫描 配目标与本对话授权；场景页开启「网络扫描」本机能力；enterprise profile）。
  4. **禁止**声称已扫描而未实际拿到 tool 结果；禁止编造开放端口。
  5. 不使用 shell_exec / evaluate / host_computer 绕过 NetSec 门禁。
  6. 扫描结果可能含内网拓扑信息：摘要给用户即可，勿建议对外公开完整原始 dump。

  ## 工作流
  1. 澄清范围与授权状态（是否已在设置中配置允许扫描目标、本对话是否已授权）。
  2. 用 `netsec_port_scan` 按最小必要端口集探测（优先常见服务端口，再按用户指定扩展）。
  3. 解读：开放端口 → 可能服务 → 风险与建议（补丁、暴露面、是否应对外）。
  4. 输出结构：
     - **范围与前提**（目标、授权、限制）
     - **发现表**：主机 | 端口 | 状态 | 可能服务 | 备注
     - **风险与建议**（按优先级）
     - **未完成项 / 需用户确认**

  本场景会收窄工具面：仅列表标签、读页文、技能与端口扫描。装技能或全浏览器自动化请先「退出场景」。
thread_defaults:
  skill_selection_mode: manual
  knowledge_selection_mode: manual
  mcp_selection_mode: manual
workspace:
  type: none
ui:
  suitable_for: 在企业本机已开网络扫描、且目标已加入允许列表时，做端口巡检与结果解读。
  unsuitable_for: 未开 netsec 模块、未配目标白名单、装技能、本机 shell、或需要全部浏览器工具。
  tools_summary_zh: 列出标签、读页面文字、使用技能、受控端口扫描（仍需 L2 确认与任务授权）
author: cmspark
tags:
  - security
  - netsec
  - enterprise
  - port-scan
