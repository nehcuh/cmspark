<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>CMspark 工作台</title><link rel="stylesheet" href="app.css"></head><body><header><strong>CMspark</strong><span id="status" role="status">连接中</span><button id="dialog-stop" type="button" hidden>停止当前对话</button><button id="view" type="button">切换视图</button></header><div class="layout"><nav aria-label="工作台导航"><button data-page="thread.list">对话</button><button data-page="mcp.list">MCP</button><button data-page="skill.list">技能</button><button data-page="knowledge.list">知识</button><p>原生工作台 · MCP 保存需单独确认</p></nav><main><h1 id="title">对话</h1><p id="notice">正在连接原生宿主…</p><button id="mcp-new" type="button" hidden>添加 stdio MCP</button><section id="mcp-editor" hidden aria-label="MCP 配置"><h2>stdio MCP</h2><p>仅编辑命令、参数、工作目录和启用状态。已有凭据与权限设置保持原值。</p><label>名称<input id="mcp-name" autocomplete="off"></label><label>命令<input id="mcp-command" autocomplete="off"></label><label>参数（JSON 字符串数组）<textarea id="mcp-args" rows="3">[]</textarea></label><label>工作目录<input id="mcp-cwd" autocomplete="off"></label><label><input id="mcp-enabled" type="checkbox">启用（保存后可能启动或重启进程）</label><p id="mcp-feedback" role="status"></p><button id="mcp-save" type="button">请求原生确认并保存</button><button id="mcp-cancel" type="button">收起</button></section><section id="metadata-editor" hidden aria-labelledby="metadata-title"><h2 id="metadata-title">对话信息</h2><label>名称<input id="metadata-alias" maxlength="200" autocomplete="off"></label><label>人工标签（每行一个，最多 20 个）<textarea id="metadata-tags" rows="4"></textarea></label><label>手动分组<input id="metadata-folder" maxlength="40" autocomplete="off"></label><p id="metadata-feedback" role="status" aria-live="polite"></p><button id="metadata-save" type="button">保存对话信息</button><button id="metadata-cancel" type="button">取消</button></section><button id="dialog-new" type="button">新建对话</button><section id="dialog-editor" hidden aria-label="当前对话"><p id="dialog-feedback" role="status" aria-live="polite"></p><div id="dialog-history" aria-live="polite"></div><label>消息<textarea id="dialog-input" rows="4"></textarea></label><button id="dialog-send" type="button">发送</button></section><ul id="list"></ul><article id="preview" aria-live="polite"></article></main></div><script src="app.js"></script></body></html>
