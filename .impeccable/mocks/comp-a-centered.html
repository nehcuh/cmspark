<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>CMspark · Comp A Centered</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #737373;
      --line: rgba(23,23,23,.10);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #e8eaee; }
    body { display: grid; place-items: center; }
    .panel {
      width: 320px; height: 680px; background: #fff; border-radius: 20px;
      box-shadow: 0 18px 44px rgba(23,23,23,.12);
      display: flex; flex-direction: column; overflow: hidden;
      font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased;
    }
    .rail {
      height: 48px; display: flex; align-items: center; padding: 0 10px 0 14px; flex-shrink: 0;
    }
    .rail-title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
    .icon {
      width: 32px; height: 32px; border-radius: 10px; background: #f4f4f5;
      display: grid; place-items: center; color: #171717;
    }
    .stream {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 8px 22px 12px;
    }
    .creature { width: 92px; height: 92px; margin: 0 auto 18px; }
    h1 {
      margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.035em;
      line-height: 1.25; text-align: center;
    }
    .hint { margin: 0 0 28px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .rows { display: flex; flex-direction: column; gap: 16px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: #262626; line-height: 1.4;
    }
    .row svg { flex-shrink: 0; color: #525252; }
    .composer { padding: 0 14px 18px; }
    .field {
      display: flex; align-items: flex-end; gap: 8px;
      min-height: 72px; padding: 12px 10px 10px 16px;
      border: 1px solid var(--line); border-radius: 16px;
    }
    .ph { flex: 1; color: #b0b0b0; font-size: 14px; padding: 4px 0 8px; }
    .send {
      width: 32px; height: 32px; border-radius: 999px; background: #e4e4e7;
      display: grid; place-items: center; color: #fff;
    }
    .legal { text-align: center; font-size: 10px; color: #d4d4d4; padding: 6px 12px 0; }
  </style>
</head>
<body>
  <div class="panel" id="shot">
    <header class="rail">
      <div style="width:32px"></div>
      <div class="rail-title">CMspark</div>
      <div class="icon" title="开始新对话">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          <circle cx="17.5" cy="6.5" r="2.2"/>
        </svg>
      </div>
    </header>
    <main class="stream">
      <svg class="creature" viewBox="0 0 92 92" aria-hidden="true">
        <ellipse cx="46" cy="84" rx="18" ry="4" fill="rgba(23,23,23,.08)"/>
        <circle cx="46" cy="50" r="28" fill="#fff" stroke="#171717" stroke-width="2.4"/>
        <path d="M28 36 L24 16 L40 32" fill="#fff" stroke="#171717" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M64 36 L68 16 L52 32" fill="#fff" stroke="#171717" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="38" cy="50" r="3.1" fill="#171717"/>
        <circle cx="54" cy="50" r="3.1" fill="#171717"/>
        <path d="M46 61 l1.6 4.1 4.3 1.1-4.3 1.5L46 72l-1.6-4.3-4.3-1.5 4.3-1.1z" fill="#4f46e5"/>
      </svg>
      <h1>接下来想做什么？</h1>
      <p class="hint">问问题，或让我操作当前标签。</p>
      <div class="rows">
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          总结当前打开的页面
        </div>
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 18V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H9z"/><path d="M8 21h.01" stroke-linecap="round"/></svg>
          随便和我聊两句
        </div>
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 7h8M8 12h8M8 17h5" stroke-linecap="round"/></svg>
          打开装配，接技能或场景
        </div>
      </div>
    </main>
    <footer class="composer">
      <div class="field">
        <div class="ph">畅所欲问</div>
        <div class="send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="legal">本地 Companion · 确认后才会执行危险操作</div>
    </footer>
  </div>
</body>
</html>
