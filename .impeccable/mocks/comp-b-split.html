<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>CMspark · Comp B Split</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #737373;
      --line: rgba(23,23,23,.10);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #e8eaee; }
    body { display: grid; place-items: center; }
    .panel {
      width: 320px; height: 680px; background: #fff; border-radius: 20px;
      box-shadow: 0 18px 44px rgba(23,23,23,.12);
      display: flex; flex-direction: column; overflow: hidden;
      font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased;
    }
    .rail {
      height: 44px; display: flex; align-items: center; padding: 0 10px 0 12px; gap: 8px; flex-shrink: 0;
    }
    .badge {
      font-size: 11px; font-weight: 600; color: #525252; background: #f4f4f5;
      border-radius: 999px; padding: 3px 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 99px; background: #16a34a; }
    .spacer { flex: 1; }
    .icon {
      width: 30px; height: 30px; border-radius: 9px; background: #f4f4f5;
      display: grid; place-items: center;
    }
    .stream {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 4px 18px 8px;
    }
    .hello { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .creature { width: 64px; height: 64px; flex-shrink: 0; }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.25; }
    .hint { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      min-height: 42px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 12px;
      font-size: 13px; background: #fff;
    }
    .row svg { flex-shrink: 0; color: #525252; }
    .composer { padding: 10px 14px 16px; }
    .field {
      display: flex; align-items: flex-end; gap: 8px;
      min-height: 56px; padding: 10px 10px 10px 14px;
      border: 1px solid var(--line); border-radius: 16px;
    }
    .ph { flex: 1; color: #b0b0b0; font-size: 14px; padding: 4px 0 6px; }
    .send {
      width: 30px; height: 30px; border-radius: 999px; background: #e4e4e7;
      display: grid; place-items: center; color: #fff;
    }
  </style>
</head>
<body>
  <div class="panel" id="shot">
    <header class="rail">
      <span class="badge">聊</span>
      <span class="dot" title="已连接"></span>
      <div class="spacer"></div>
      <div class="icon" title="开始新对话">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
        </svg>
      </div>
    </header>
    <main class="stream">
      <div class="hello">
        <svg class="creature" viewBox="0 0 92 92" aria-hidden="true">
          <ellipse cx="46" cy="84" rx="18" ry="4" fill="rgba(23,23,23,.08)"/>
          <circle cx="46" cy="50" r="28" fill="#fff" stroke="#171717" stroke-width="2.4"/>
          <path d="M28 36 L24 16 L40 32" fill="#fff" stroke="#171717" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M64 36 L68 16 L52 32" fill="#fff" stroke="#171717" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="38" cy="50" r="3.1" fill="#171717"/>
          <circle cx="54" cy="50" r="3.1" fill="#171717"/>
          <path d="M46 61 l1.6 4.1 4.3 1.1-4.3 1.5L46 72l-1.6-4.3-4.3-1.5 4.3-1.1z" fill="#4f46e5"/>
        </svg>
        <div>
          <h1>接下来想做什么？</h1>
          <p class="hint">问问题，或让我操作当前页。</p>
        </div>
      </div>
      <div class="rows">
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          总结当前打开的页面
        </div>
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 18V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H9z"/></svg>
          随便和我聊两句
        </div>
        <div class="row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 7h8M8 12h8M8 17h5" stroke-linecap="round"/></svg>
          打开装配，接技能或场景
        </div>
      </div>
    </main>
    <footer class="composer">
      <div class="field">
        <div class="ph">畅所欲问</div>
        <div class="send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
